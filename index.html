<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE LABEL 더 라벨</title>
<meta name="description" content="하늘에서 떨어진 라벨, 쓰는 대로 현실이 된다면? — AI 단편 영화 〈THE LABEL〉">
<meta property="og:title" content="THE LABEL 더 라벨">
<meta property="og:description" content="하늘에서 떨어진 라벨, 쓰는 대로 현실이 된다면? — AI 단편 영화 · 3분 6초">
<meta property="og:image" content="https://thelabel-film.github.io/og.jpg">
<meta property="og:type" content="video.other">
<meta name="theme-color" content="#0c0c0d">
<style>
  /* 展板同款字体 Freesentation（只保留本页用到的字） */
  @font-face { font-family:F; font-weight:500; src:url("fonts/fs-500.woff2") format("woff2"); font-display:swap; }
  @font-face { font-family:F; font-weight:800; src:url("fonts/fs-800.woff2") format("woff2"); font-display:swap; }
  :root { --bg:#0c0c0d; --fg:#f2efe9; --dim:#8d8a85; --line:#2a2826; --accent:#f0a21c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:var(--bg); }
  /* 黑底 + 发表 PPT 同款飘落的标签（3D 加载失败时就是纯黑底） */
  body {
    color:var(--fg); font-family:F, system-ui, sans-serif; font-weight:500; word-break:keep-all;
    background:var(--bg);
    min-height:100svh; display:flex; flex-direction:column; align-items:center;
    padding:max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  #gl { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  main, footer { position:relative; z-index:1; }
  main { width:100%; max-width:1100px; }
  .meta { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  h1 { margin-top:14px; font-weight:800; font-size:clamp(36px, 8.5vw, 68px); letter-spacing:.01em; line-height:1; text-shadow:0 2px 18px rgba(0,0,0,.45); }
  h1 span { font-size:.42em; color:var(--accent); margin-left:.4em; letter-spacing:0; vertical-align:.35em; }
  .hook { margin-top:12px; color:var(--dim); font-size:16px; }
  .player { margin-top:24px; aspect-ratio:16/9; background:#000; border:1px solid var(--line); box-shadow:0 24px 60px rgba(0,0,0,.55); }
  video { display:block; width:100%; height:100%; background:#000; }
  .info { margin-top:16px; display:flex; flex-wrap:wrap; gap:6px 18px; font-size:14px; color:var(--dim); }
  .info b { color:var(--fg); font-weight:800; }
  footer { margin-top:auto; padding-top:40px; font-size:11px; color:#55524e; letter-spacing:.06em; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<main>
  <div class="meta">2026 KHU AI Challenge · AI 창작콘텐츠</div>
  <h1>THE LABEL<span>더 라벨</span></h1>
  <p class="hook">하늘에서 떨어진 라벨, 쓰는 대로 현실이 된다면?</p>

  <div class="player">
    <video controls playsinline preload="metadata" poster="poster.jpg"
           controlslist="nodownload noremoteplayback noplaybackrate" disablepictureinpicture disableremoteplayback>
      <source src="the-label-hq.mp4" type="video/mp4">
    </video>
  </div>

  <div class="info">
    <span><b>AI 단편 영화</b> · 3분 6초</span>
    <span>한국어 / 영어 자막</span>
    <span><b>NOT BAD 팀</b></span>
  </div>
</main>
<footer>© 2026 NOT BAD · THE LABEL</footer>

<script>
  // 不提供下载：去掉右键菜单（“视频另存为”）
  document.querySelector('video').addEventListener('contextmenu', e => e.preventDefault());
</script>
<script type="module">
// 飘落的标签（发表 PPT 开场同款 three.js 场景，calm 节奏）。3D 加载失败时只剩黑底，视频不受影响。
let THREE;
for (const u of ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
                 'https://unpkg.com/three@0.160.0/build/three.module.js']) {
  try { THREE = await import(u); break; } catch (e) {}
}
if (THREE) {
  const canvas = document.getElementById('gl');
  const mobile = innerWidth < 768;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.25 : 1.5));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0c0c0d, 4, 28);
  const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 120); cam.position.set(0, 0, 10);
  scene.add(new THREE.HemisphereLight(0xfff0dc, 0x1a0e0a, 1.1));
  const key = new THREE.DirectionalLight(0xffd8a0, 2.2); key.position.set(4, 6, 8); scene.add(key);
  const rim = new THREE.DirectionalLight(0xff5a30, 1.2); rim.position.set(-6, -2, -4); scene.add(rim);

  const tl = new THREE.TextureLoader();
  const tex = u => { const t = tl.load(u); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
  const AR = 974 / 366;
  const geo = new THREE.PlaneGeometry(AR, 1, 6, 1);
  { const p = geo.attributes.position; for (let i = 0; i < p.count; i++) p.setZ(i, 0.07 * Math.cos(p.getX(i) * 1.2)); geo.computeVertexNormals(); }

  // 标签只在内容后面（z < -4），不挡视频
  function spawn(p, init) {
    p.x = (Math.random() - .5) * 34; p.z = -30 + Math.random() * 26;
    p.y = init ? (Math.random() - .5) * 26 : 13 + Math.random() * 4;
    p.vy = .55 + Math.random() * .9; p.sw = Math.random() * 6.28; p.sa = .4 + Math.random() * .9; p.sf = .4 + Math.random() * .8;
    p.rx = Math.random() * 6.28; p.ry = Math.random() * 6.28; p.rz = Math.random() * 6.28;
    p.wx = (Math.random() - .5) * 2.4; p.wy = (Math.random() - .5) * 2.4; p.wz = (Math.random() - .5) * 1.6;
    p.s = .45 + Math.random() * .75;
    return p;
  }
  function swarm(t, n) {
    const mat = new THREE.MeshStandardMaterial({ map: t, side: THREE.DoubleSide, alphaTest: .45, roughness: .82 });
    const im = new THREE.InstancedMesh(geo, mat, n); im.frustumCulled = false; scene.add(im);
    const P = []; for (let i = 0; i < n; i++) P.push(spawn({}, true));
    return { im, P };
  }
  const SW = [swarm(tex('label_y.png'), mobile ? 34 : 60), swarm(tex('label_r.png'), mobile ? 26 : 46)];
  const dummy = new THREE.Object3D();
  const mouse = { x: 0, y: 0 };
  addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth - .5; mouse.y = e.clientY / innerHeight - .5; });
  function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();

  const SPEED = .4;
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!document.hidden) {
      cam.position.x += (mouse.x * 1.2 - cam.position.x) * dt * 2; cam.position.y += (-mouse.y * .8 - cam.position.y) * dt * 2; cam.lookAt(0, 0, 0);
      for (const S of SW) {
        S.P.forEach((p, i) => {
          p.y -= p.vy * dt * SPEED * 2.2; p.sw += dt * p.sf * SPEED * 2;
          p.rx += p.wx * dt * SPEED; p.ry += p.wy * dt * SPEED; p.rz += p.wz * dt * SPEED;
          if (p.y < -14) spawn(p, false);
          dummy.position.set(p.x + Math.sin(p.sw) * p.sa, p.y, p.z + Math.cos(p.sw * .7) * .4);
          dummy.rotation.set(p.rx + Math.sin(p.sw) * .6, p.ry, p.rz);
          dummy.scale.setScalar(p.s);
          dummy.updateMatrix(); S.im.setMatrixAt(i, dummy.matrix);
        });
        S.im.instanceMatrix.needsUpdate = true;
      }
      renderer.render(scene, cam);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
